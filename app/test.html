<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Path to Germany self-check</title></head>
<body>
<div id="app" hidden></div>
<pre id="out">running…</pre>
<script type="module">
// Self-check for helpers in main.js. Serve app/ (python -m http.server -d app) and open /test.html; it prints ok.
import { route, findWord, genderRule, umlaut, pluralPattern, fmtInterval, present, preterite, imperative, verbMistakes, perfect,
  spreadNew, checkAnswer, diffChars, countWords, writingHints, pointFound, knownShare, buildForms } from './main.js'
import { examPass } from './main.js'

const fails = []
const check = (ok, what) => { if (!ok) fails.push(what) }
const eq = (a, b) => JSON.stringify(a) === JSON.stringify(b)

check(eq(route('#/station/4/grammar'), { page: 'station', arg: '4', sub: 'grammar' }), 'route: station tab')
check(route('').page === '' && route('#/').page === '', 'route: home')
check(eq(route('#/tests/A2/lesen/7'), { page: 'tests', arg: 'A2', sub: 'lesen', sub2: '7' }), 'route: numbered test')

// word-boundary matcher: forms are found, compounds and look-alikes are not
const haus = { w: 'Haus', p: 'n', a: 'das', pl: 'Häuser' }
const at = (s, w) => { const r = findWord(s, w); return r && s.slice(...r) }
check(at('Wir wohnen in einem Haus.', haus) === 'Haus', 'findWord: noun')
check(at('Die Häuser sind alt.', haus) === 'Häuser', 'findWord: plural')
check(at('Er liegt im Krankenhaus.', haus) === null, 'findWord: not inside Krankenhaus')
check(at('Ich bin zu Hause.', haus) === 'Hause', 'findWord: dative -e')
const um = { w: 'um', p: 'prep' }
check(at('Die Umwelt ist wichtig.', um) === null && at('Wir essen um acht.', um) === 'um', 'findWord: um, not Umwelt')
const fahren = { w: 'fahren', p: 'v', f: 'fährt, fuhr, ist gefahren' }
check(at('Lena fährt nach Berlin.', fahren) === 'fährt' && at('Wir sind gefahren.', fahren) === 'gefahren' && at('Du fährst.', fahren) === 'fährst', 'findWord: verb forms')
const aufstehen = { w: 'aufstehen', p: 'v', f: 'steht auf, stand auf, ist aufgestanden' }
check(at('Ich stehe um sieben auf.', aufstehen) === 'stehe', 'findWord: separable verb')
const alt = { w: 'alt', p: 'adj' }
check(at('Das ist ein altes Haus.', alt) === 'altes' && at('Wir halten an.', alt) === null, 'findWord: adjective endings, not inside halten')

// known words in a text (40-reading.js, L11): extra forms, compounds, place names; a glossed word counts only if learned
const kw = [['der', 'art'], ['welcher', 'art'], ['in', 'prep'], ['ich', 'pron'], ['wohnen', 'v', , , 'wohnt, wohnte, hat gewohnt'],
  ['Kind', 'n', 'das', 'Kinder'], ['Zimmer', 'n', 'das', 'Zimmer'], ['Öffnung', 'n', 'die', 'Öffnungen'], ['Zeit', 'n', 'die', 'Zeiten'],
  ['Haus', 'n', 'das', 'Häuser', , 9]].map(([w, p, a, pl, f, n = 1]) => ({ w, p, a, pl, f, n }))
const kix = buildForms(kw)
const share = (de, en) => knownShare({ blocks: [{ s: [[de, en]] }], glossary: [{ w: 'Haus', en: 'house' }] }, w => w.n <= 1, kix)
check(share('Welche Kinderzimmer?', "Which children's rooms?").share === 1, 'knownShare: welche, and the compound Kinder|zimmer')
check(share('Die Öffnungszeiten', 'The opening hours').share === 1, 'knownShare: Öffnung|s|zeiten with a linking s')
check(share('Ich wohne in Köln.', 'I live in Cologne.').share === 1, 'knownShare: Köln/Cologne is a name, not an unknown word')
check(share('Ich wohne im Haus.', 'I live in the house.').share === 0.75, 'knownShare: a glossed word not learned yet is unknown')
check(share('Kinder, Xylofonzimmer', 'Children, xylophone room').share === 0.5, 'knownShare: a compound with an unknown part is unknown')

// gender rules and plurals
const rule = w => genderRule({ w })?.art
check(rule('Zeitung') === 'die' && rule('Mädchen') === 'das' && rule('Frühling') === 'der' && rule('Museum') === 'das', 'genderRule: strong endings')
check(rule('Lampe') === 'die' && rule('Montag') === 'der' && rule('Tisch') === undefined, 'genderRule: -e, days, no rule')
check(genderRule({ w: 'Essen' }, new Set(['essen'])).art === 'das', 'genderRule: verb as noun')
check(umlaut('Mutter') === 'Mütter' && umlaut('Haus') === 'Häus' && umlaut('Apfel') === 'Äpfel' && umlaut('Buch') === 'Büch' && umlaut('Tisch') === 'Tisch', 'umlaut')
check(pluralPattern('Tisch', 'Tische') === '-e' && pluralPattern('Haus', 'Häuser') === 'umlaut + -er' && pluralPattern('Lehrer', 'Lehrer') === 'no change'
  && pluralPattern('Mutter', 'Mütter') === 'umlaut only' && pluralPattern('Auto', 'Autos') === '-s' && pluralPattern('Lampe', 'Lampen') === '-n', 'pluralPattern')
check(fmtInterval(30e3) === '1m' && fmtInterval(90 * 60e3) === '2h' && fmtInterval(3 * 864e5) === '3d', 'fmtInterval')

// new cards spread among the reviews (L1)
const mixed = spreadNew(Array.from({ length: 30 }, (_, i) => `r${i}`), Array.from({ length: 10 }, (_, i) => `n${i}`))
check(mixed.length === 40 && mixed[0][0] === 'r' && mixed.every((x, i) => !(x[0] === 'n' && mixed[i + 1]?.[0] === 'n')), 'spreadNew: review first, no two new cards together')
check(eq(spreadNew([], ['n0', 'n1']), ['n0', 'n1']) && eq(spreadNew(['r0'], []), ['r0']), 'spreadNew: only one kind')

// typed answers (L2)
const tisch = { w: 'Tisch', p: 'n', a: 'der' }
const v = (t, w = tisch) => checkAnswer(t, w).verdict
check(v('der Tisch') === 'right' && v('Der tisch') === 'close' && v('die Tisch') === 'wrong' && v('Tisch') === 'wrong' && v('der Tish') === 'typo', 'checkAnswer: Tisch')
check(v('das Maedchen', { w: 'Mädchen', p: 'n', a: 'das' }) === 'close' && v('die Strasse', { w: 'Straße', p: 'n', a: 'die' }) === 'close', 'checkAnswer: umlauts and ß typed out')
check(v('freuen', { w: 'sich freuen', p: 'v' }) === 'close' && v('aufstehen', { w: 'aufstehen', p: 'v' }) === 'right', 'checkAnswer: sich and verbs')
const auto = { w: 'Auto', p: 'n', a: 'das', en: 'car' }, wagen = { w: 'Wagen', p: 'n', a: 'der', en: 'car' }
const syn = checkAnswer('der Wagen', auto, [auto, wagen])
check(syn.verdict === 'close' && syn.notes[0] === 'Also right; this card wants das Auto.', 'checkAnswer: another word with the same English')
check(checkAnswer('Der tisch', tisch).notes.length === 1 && checkAnswer('die Tisch', tisch).notes[0].startsWith('The article belongs'), 'checkAnswer: notes')
check(diffChars('Tish', 'Tisch').map(([c, k]) => (k === 'same' ? c : `[${k[0]}${c}]`)).join('') === 'Tis[mc]h', 'diffChars: missing letter')

// conjugation: every generated form must be one Wiktionary lists (app/test-verbs.json, from build_data.py --verb-fixture)
const verbs = await (await fetch('test-verbs.json')).json()
let forms = 0
for (const t of verbs) {
  const w = { w: t.w, p: 'v', f: t.f }
  const mine = { present: present(w), preterite: preterite(w), imperative: imperative(w).slice(0, 2).map(x => x.replace(/!$/, '')) }
  for (const tense of ['present', 'preterite', 'imperative']) {
    t[tense].forEach((ok, i) => {
      if (!ok.length) return
      forms++
      check(ok.includes(mine[tense][i]), `${t.w} ${tense} ${i}: made "${mine[tense][i]}", Wiktionary has ${ok.join(' / ')}`)
    })
  }
  ;[0, 2, 3].forEach(i => check(!verbMistakes(w, 'perfect', i).includes(perfect(w, i)), `${t.w}: a mistake equals the right Perfekt`))
}
check(verbs.length >= 50 && forms > 600, `only ${verbs.length} verbs / ${forms} forms checked`)

// writing hints (50-writing.js): each simple check fires on its mistake and stays quiet on a clean text
const wt = { level: 'A1', words: [25, 40], phrases: [['Lieber Felix,', 'Dear Felix,'], ['Viele Grüße', 'Best wishes']],
  model: 'Lieber Felix, ich wohne jetzt in Köln. Wann kommst du? Viele Grüße, Priya' }
const kinds = text => writingHints(text, wt, new Map([['kurs', 'Kurs']])).map(h => h.k).sort().join(' ')
const hint = (text, k) => writingHints(text, wt, new Map([['kurs', 'Kurs']])).find(h => h.k === k)?.de
check(countWords('Am 13. Juni, z.B. um 18:00 – E-Mail!') === 7, 'countWords: numbers, abbreviations, dashes')
check(kinds('Lieber Felix,\nich wohne jetzt in Köln. Im Kurs sind wir zehn Leute. Wann kommst du?\nViele Grüße\nSneka') === '', 'writingHints: clean text')
check(hint('Lieber Felix, heute ich gehe ins Kino.', 'order') === 'heute ich gehe → heute gehe ich', 'writingHints: verb second')
check(hint('Lieber Felix, ich bleibe zu Hause, weil ich bin müde.', 'order') === 'weil ich bin müde → weil ich müde bin', 'writingHints: verb at the end')
check(!hint('Lieber Felix, ich weiß, dass er kommt und wir gehen.', 'order'), 'writingHints: no verb-end hint for a correct clause')
check(hint('Lieber Felix, der kurs ist gut.', 'caps') === 'kurs → Kurs', 'writingHints: lower-case noun')
check(kinds('Lieber Felix, wann kommen Sie? Wann kommst du?') === 'reg', 'writingHints: du and Sie mixed')
check(kinds('Ich wohne jetzt in Köln.') === 'frame', 'writingHints: no greeting')
check(pointFound('Wir sind zehn Leute aus acht Ländern.', 'Wer im Kurs ist (Länder, Sprachen)') && !pointFound('Hallo, wie geht es dir?', 'Wer im Kurs ist (Länder, Sprachen)'), 'pointFound: key-word stems')
check(pointFound('Wann kommst du?', 'Frage: Wann kommt Felix zu Besuch?', 'Felix') && !pointFound('Du kommst bald.', 'Frage: Wann kommt Felix zu Besuch?', 'Felix'), 'pointFound: a question needs ?')
check(pointFound('Mir geht es nicht gut, ich habe Fieber.', 'Warum kommen Sie nicht?'), 'pointFound: a reason without weil')

// Goethe pass rules (85-tests.js): A1 60 overall; A2 also 45 of 75 written and 15 of 25 spoken; B1 60 in every module
const mods = (...ps) => ['Lesen', 'Hören', 'Schreiben', 'Sprechen'].map((m, i) => ({ m, pts: ps[i], max: ps.length > 4 ? ps[4] : 25 }))
check(examPass('A1', mods(25, 25, 10, 0)) && !examPass('A2', mods(25, 25, 10, 0)) && examPass('A2', mods(15, 15, 15, 15)), 'examPass: A2 needs 15 of 25 in Sprechen')
check(!examPass('A2', mods(14, 15, 15, 25)) && examPass('B1', mods(60, 60, 60, 60, 100)) && !examPass('B1', mods(100, 100, 100, 59, 100)), 'examPass: A2 45 written, B1 every module')

document.getElementById('out').textContent = fails.length ? `FAIL\n${fails.join('\n')}` : 'ok'
document.title = fails.length ? 'FAIL' : 'ok'
</script>
</body>
</html>
